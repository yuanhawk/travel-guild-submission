# Local secret/leak-scanning gates -- see .github/workflows/ci.yml for the
# CI-side mirror of these same two checks (gitleaks + scan_infra_leaks).
#
# Activate on a fresh clone:
#   pip install pre-commit && pre-commit install
#
# Version pinned to a known-good gitleaks release (v8.21.2).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: scan-infra-leaks
        name: scan-infra-leaks (public IPs / AliCloud resource ids / docs images)
        entry: python3 scripts/scan_infra_leaks.py --staged
        language: system
        pass_filenames: false
